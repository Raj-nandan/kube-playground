global:
  partOf: playground

# Meshless mode (Milestone 1 style: native K8s Service selector flips, no sidecars)
mesh:
  enabled: false

services:
  a:
    strategy: blue-green
    activeTrack: blue
    ports:
      http: 8080
      admin: 9090
    serviceAccount:
      create: true
    tracks:
      blue:
        image: svc-a
        tag: blue
        replicas: 1
      green:
        image: svc-a
        tag: green
        replicas: 0
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCpu: 50

  b:
    strategy: canary
    activeTrack: stable
    ports:
      http: 8080
      admin: 9090
    serviceAccount:
      create: true
    tracks:
      stable:
        image: svc-b
        tag: stable
        replicas: 1
      canary:
        image: svc-b
        tag: canary
        replicas: 0
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCpu: 50

  c:
    strategy: rolling-update
    activeTrack: current
    ports:
      http: 8080
      admin: 9090
    serviceAccount:
      create: true
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    tracks:
      current:
        image: svc-c
        tag: current
        replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCpu: 50
