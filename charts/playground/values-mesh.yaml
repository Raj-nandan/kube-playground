global:
  partOf: playground

# Full Istio Service Mesh mode (Milestone 2 style)
mesh:
  enabled: true
  gateway:
    name: playground-gateway
    port: 80
  adminPort: 9090
  sidecar:
    proxyCPU: "50m"
    proxyMemory: "64Mi"

services:
  a:
    strategy: blue-green
    activeTrack: blue
    ports:
      http: 8080
      admin: 9090
    serviceAccount:
      create: true
    tracks:
      blue:
        image: svc-a
        tag: blue
        replicas: 1
        weight: 100
      green:
        image: svc-a
        tag: green
        replicas: 0
        weight: 0
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCpu: 50

  b:
    strategy: canary
    activeTrack: stable
    ports:
      http: 8080
      admin: 9090
    serviceAccount:
      create: true
    tracks:
      stable:
        image: svc-b
        tag: stable
        replicas: 1
        weight: 100
      canary:
        image: svc-b
        tag: canary
        replicas: 0
        weight: 0
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCpu: 50

  c:
    strategy: rolling-update
    activeTrack: current
    ports:
      http: 8080
      admin: 9090
    serviceAccount:
      create: true
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    tracks:
      current:
        image: svc-c
        tag: current
        replicas: 1
        weight: 100
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCpu: 50
