apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: svc-b-stable
  namespace: apps
  labels:
    app: svc-b
    track: stable
    part-of: playground
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: svc-b-stable
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: app
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15

