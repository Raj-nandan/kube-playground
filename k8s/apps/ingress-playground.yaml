apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: playground
  namespace: apps
  labels:
    part-of: playground
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /a(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: svc-a
                port:
                  number: 8080
          - path: /b(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: svc-b
                port:
                  number: 8080
          - path: /c(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: svc-c
                port:
                  number: 8080
