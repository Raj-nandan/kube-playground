apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: svc-c
  namespace: apps
spec:
  host: svc-c
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
  subsets:
    - name: default
      labels:
        app: svc-c
