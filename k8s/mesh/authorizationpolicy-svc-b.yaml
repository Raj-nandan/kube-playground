apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: svc-b
  namespace: apps
spec:
  selector:
    matchLabels:
      app: svc-b
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account
              - cluster.local/ns/apps/sa/svc-a
      to:
        - operation:
            ports: ["8080"]
    - to:
        - operation:
            ports: ["9090"]
