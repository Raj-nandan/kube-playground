apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-api-loadtest
  namespace: loadtest
  labels:
    app: control-api
    part-of: playground
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

