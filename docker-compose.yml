services:
  svc-a:
    image: svc-a:blue
    build:
      context: ./services
      args:
        RELEASE_LABEL: blue
    environment:
      SERVICE_NAME: a
      PEERS: a=http://svc-a:8080,b=http://svc-b:8080,c=http://svc-c:8080
    ports:
      - "8081:8080"
      - "9091:9090"

  svc-b:
    image: svc-b:stable
    build:
      context: ./services
      args:
        RELEASE_LABEL: stable
    environment:
      SERVICE_NAME: b
      PEERS: a=http://svc-a:8080,b=http://svc-b:8080,c=http://svc-c:8080
    ports:
      - "8082:8080"
      - "9092:9090"

  svc-c:
    image: svc-c:current
    build:
      context: ./services
      args:
        RELEASE_LABEL: current
    environment:
      SERVICE_NAME: c
      PEERS: a=http://svc-a:8080,b=http://svc-b:8080,c=http://svc-c:8080
    ports:
      - "8083:8080"
      - "9093:9090"

